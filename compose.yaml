services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: quorum
      POSTGRES_PASSWORD: quorum
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U quorum
      interval: 2s

  redis:
    image: redis:7.4
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: redis-cli ping
      interval: 2s

volumes:
  postgres-data:
