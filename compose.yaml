x-node: &node
  image: node:24-slim
  working_dir: /app
  volumes:
    - .:/app
  environment:
    DATABASE_URL: postgres://quorum:quorum@postgres:5432/quorum
    REDIS_URL: redis://redis:6379
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-not-for-production}
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-auth-secret-not-for-production}
    S3_BUCKET_URL: http://s3:9090/quorum
    S3_REGION: us-east-1
    S3_ACCESS_KEY_ID: dev
    S3_SECRET_ACCESS_KEY: dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: quorum
      POSTGRES_PASSWORD: quorum
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U quorum
      interval: 2s

  redis:
    image: redis:7.4
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: redis-cli ping
      interval: 2s

  # Images des questions (ADR 0013) : un serveur compatible S3 à la place du bucket Railway. Il accepte n'importe quelles clés.
  s3:
    image: adobe/s3mock:5
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: quorum
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - s3-data:/s3mockroot

  migrate:
    <<: *node
    command: node packages/db/src/migrate.ts
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *node
    command: node --watch apps/api/src/main.ts
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3:
        condition: service_started
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s

  realtime:
    <<: *node
    command: node --watch apps/realtime/src/main.ts
    deploy:
      replicas: 3
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s

  web:
    <<: *node
    working_dir: /app/apps/web
    command: node_modules/.bin/vite dev --host 0.0.0.0 --port 3000
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s

  caddy:
    image: caddy:2
    ports:
      - 8080:8080
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - realtime
      - web

  # make e2e : l'image officielle de Playwright, à la même version que la dépendance. Elle partage le réseau de Caddy,
  # pour que le navigateur de test atteigne l'app sur la même origine que PUBLIC_ORIGIN.
  e2e:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    profiles: [e2e]
    network_mode: service:caddy
    working_dir: /app/apps/web
    volumes:
      - .:/app
    environment:
      BASE_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}
    command: node_modules/.bin/playwright test --config tests/playwright.config.ts

volumes:
  postgres-data:
  s3-data:
